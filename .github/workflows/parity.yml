# The agreement between the two adaptels packages: rgeoadaptels in adaptels/r/
# against pygeoadaptels in adaptels/python/, both taken from the commit under
# test. Runs when either folder changes, because either side can break it.

on:
  push:
    branches: [main]
    paths: ["adaptels/python/**", "adaptels/r/**", ".github/workflows/parity.yml"]
  pull_request:
    paths: ["adaptels/python/**", "adaptels/r/**", ".github/workflows/parity.yml"]
  workflow_dispatch:

name: parity

permissions: read-all

jobs:
  identical:
    # An equality check, not a tolerance. This is a port of the same kernel,
    # so a single differing pixel is a bug rather than a difference of
    # opinion, and the script exits non-zero on one.
    runs-on: ubuntu-latest
    name: rgeoadaptels identical to pygeoadaptels

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: adaptels/r

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          working-directory: adaptels/r

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pygeoadaptels from this commit
        # From adaptels/python/ in the same checkout, so the two halves of
        # one commit are compared with each other. Before the packages shared
        # a repository this step installed pygeoadaptels from a pinned tag,
        # and a stale pin proved the agreement against an old release.
        #
        # The [connectivity] extra is scipy, and it is needed because the
        # reference generator calls enforce_connectivity(). scipy is
        # genuinely optional for the rest of that package -- it is imported
        # inside the one function that uses it, which raises a clear
        # ImportError naming the extra -- so asking for it here is the
        # caller's job, not something to fix upstream. Do not drop it back
        # to a bare install; the generator will get through every adaptel
        # case and then fail on the first connectivity one.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "../python[connectivity]"

      - name: Check the version declarations agree
        # CITATION.cff is .Rbuildignore'd, so R CMD check never sees it.
        run: Rscript tools/check_versions.R

      - name: Install rgeoadaptels
        run: R CMD INSTALL .

      - name: Generate reference segmentations
        run: python tools/generate_pygeoadaptels_reference.py

      - name: Compare
        run: Rscript tools/cross_validate_against_pygeoadaptels.R
