# What can be checked of the plugin in qgis/ without a QGIS: its modules
# import and build their dialogs against a stub `qgis` module, the layer that
# calls the packages gives the right files on the test data of the repository,
# pyflakes finds nothing, and the zip builds with the two packages vendored.
# The Processing runtime itself is tested in a live QGIS.
#
# The zip carries pygeoadaptels from adaptels/python/ of the commit under
# test, so this workflow also runs when that package changes.
name: qgis-tests

on:
  push:
    branches: [main]
    paths: ["qgis/**", "adaptels/python/pygeoadaptels/**", "adaptels/python/test_data/**", ".github/workflows/qgis-tests.yml"]
  pull_request:
    paths: ["qgis/**", "adaptels/python/pygeoadaptels/**", "adaptels/python/test_data/**", ".github/workflows/qgis-tests.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository (the plugin and pygeoadaptels)
        uses: actions/checkout@v4
        with:
          path: geosegments

      - name: Check out geopalette (pygeopalette is vendored into the zip)
        uses: actions/checkout@v4
        with:
          repository: igorpawelec/geopalette
          path: geopalette

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test tools and the two packages from the checkouts
        # The packages the plugin bundles, from the commits under test, with
        # what they need to read and write files: tests/test_core_calls.py
        # runs the plugin's package-call layer on the real test data.
        run: |
          python -m pip install pytest pyflakes numpy numba scipy rasterio fiona
          python -m pip install --no-deps ./geosegments/adaptels/python ./geopalette/python

      - name: Lint
        working-directory: geosegments/qgis
        run: python -m pyflakes geoadaptels_palette/ build_zip.py tests/test_stub_import.py tests/test_helpers.py tests/test_core_calls.py

      - name: Test the plugin against a stub qgis and the packages
        working-directory: geosegments/qgis
        run: python -m pytest -v -rs tests

      - name: Build the zip
        working-directory: geosegments/qgis
        run: python build_zip.py

      - name: Check the zip really carries the vendored packages
        working-directory: geosegments/qgis
        run: |
          python - <<'PY'
          import glob, zipfile
          z = sorted(glob.glob("dist/*.zip"))
          assert z, "no zip was produced"
          names = zipfile.ZipFile(z[-1]).namelist()
          for pkg in ("pygeoadaptels", "pygeopalette"):
              assert [n for n in names if f"vendor/{pkg}/__init__.py" in n], f"{pkg} missing from vendor/"
          assert not [n for n in names if n.endswith(".pyc")], "bytecode in zip"
          print(f"{z[-1]}: {len(names)} files, two packages vendored")
          PY

      - name: Keep the zip as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: geoadaptels_palette-zip
          path: geosegments/qgis/dist/*.zip
