# The fast checks of the sigments prototype in sigments/. Runs only when that
# folder or this file changes. The benchmarks in sigments/bench/ need data
# that are not in the repository and are run by hand.
name: sigments-tests

on:
  push:
    branches: [main]
    paths: ["sigments/**", ".github/workflows/sigments-tests.yml"]
  pull_request:
    paths: ["sigments/**", ".github/workflows/sigments-tests.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: sigments

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v
