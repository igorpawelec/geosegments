[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigments"
version = "0.1.0.dev0"
description = "Sigma-regulated segments: image segmentation with one dimensionless tolerance (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Igor Pawelec" }]
license = { text = "All rights reserved; a licence will be chosen before the repository is made public" }
dependencies = ["numpy", "numba", "scipy"]

[project.optional-dependencies]
io = ["rasterio", "geopandas", "shapely"]
bench = ["rasterio", "geopandas", "shapely", "scikit-image", "matplotlib"]
dev = ["pytest"]

[tool.setuptools]
packages = ["sigments"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
